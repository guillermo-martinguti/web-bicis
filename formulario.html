<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario - TIENDA DE BICIS</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <h1>TIENDA DE BICIS</h1>

    <nav>
        <ul>
            <li><a href="index.html">INICIO</a></li>
            <li><a href="bicis.html">BICICLETAS</a></li>
            <li><a href="formulario.html">FORMULARIO</a></li>
        </ul>
    </nav>

    <h2>Formulario de contacto</h2>

    <p class="intro">
        Si lo desea, puede rellenar el siguiente formulario indicando qué tipo de bicicletas
        busca y le responderemos con la mayor brevedad posible.
    </p>

    <form action="" method="post">

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre">

        <label for="apellidos">Apellidos:</label>
        <input type="text" id="apellidos" name="apellidos">

        <label for="direccion">Dirección:</label>
        <input type="text" id="direccion" name="direccion">

        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" name="correo">

        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono">

        <label for="fecha">Fecha de nacimiento:</label>
        <input type="date" id="fecha" name="fecha">

        <label>Sexo:</label>
        <input type="radio" id="hombre" name="sexo" value="hombre">
        <label for="hombre" class="opcion">Hombre</label>
        <input type="radio" id="mujer" name="sexo" value="mujer">
        <label for="mujer" class="opcion">Mujer</label>

        <label for="estado">Las bicicletas tienen que ser:</label>
        <select id="estado" name="estado">
            <option value="nuevas">Nuevas</option>
            <option value="usadas">Pueden ser usadas</option>
        </select>

        <label for="observaciones">Observaciones:</label>
        <textarea id="observaciones" name="observaciones" rows="6"></textarea>

        <input type="submit" value="Enviar">
        <input type="reset" value="Borrar">

    </form>

    <footer>
        <a href="index.html">INICIO</a>
    </footer>

</body>
</html>
